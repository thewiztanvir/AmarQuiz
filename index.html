<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AmarQuiz – AI-powered quiz generator. Enter your API key and generate quizzes on any topic instantly using Gemini, OpenAI, or Claude." />
  <title>AmarQuiz – AI Quiz Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== BACKGROUND EFFECTS ===== -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- ===== APP WRAPPER ===== -->
  <div class="app" id="app">

    <!-- ===== STEP 1 : API KEY ===== -->
    <section class="screen active" id="screen-api" aria-label="API Key Setup">
      <div class="card glass fade-in">
        <div class="logo-wrap">
          <span class="logo-icon">⚡</span>
          <h1 class="logo-text">Amar<span class="accent">Quiz</span></h1>
        </div>
        <p class="tagline">AI-powered quizzes on any topic, instantly.</p>

        <div class="api-provider-group" id="providerGroup">
          <label class="section-label">Choose AI Provider</label>
          <div class="provider-pills">
            <button class="pill active" data-provider="gemini" id="pill-gemini">
              <img src="https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ff6292a690345.svg" alt="" width="18" height="18" />
              Gemini
            </button>
            <button class="pill" data-provider="openai" id="pill-openai">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.896zm16.597 3.855l-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/></svg>
              OpenAI
            </button>
            <button class="pill" data-provider="claude" id="pill-claude">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.304 1.262a.737.737 0 0 0-1.008.275L12 8.845 7.704 1.537A.737.737 0 0 0 6.417 2.27l4.47 7.62H5.27a.737.737 0 0 0 0 1.474h5.618l-4.47 7.62a.737.737 0 0 0 1.287.718L12 12.49l4.295 7.212a.737.737 0 0 0 1.287-.718l-4.47-7.62h5.618a.737.737 0 0 0 0-1.474h-5.617l4.47-7.62a.737.737 0 0 0-.279-1.008z"/></svg>
              Claude
            </button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="apiKeyInput">API Key</label>
          <div class="input-wrap">
            <input
              type="password"
              id="apiKeyInput"
              class="field-input"
              placeholder="Paste your API key here…"
              autocomplete="off"
              spellcheck="false"
            />
            <button class="toggle-vis" id="toggleVis" aria-label="Toggle key visibility" title="Show / Hide">
              <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field-hint">Your key is stored only in memory and never sent to our servers.</p>
        </div>

        <div class="field-group" id="modelFieldGroup" style="display:none">
          <label class="field-label" for="modelInput">Model <span class="optional">(optional)</span></label>
          <input
            type="text"
            id="modelInput"
            class="field-input"
            placeholder="e.g. gpt-4o, gemini-2.0-flash…"
          />
        </div>

        <button class="btn-primary" id="btnContinue">
          <span>Continue</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>

        <p class="privacy-note">🔒 Your API key is never stored or transmitted to any server other than the AI provider.</p>
      </div>
    </section>

    <!-- ===== STEP 2 : GENERATE QUIZ ===== -->
    <section class="screen" id="screen-generate" aria-label="Quiz Generator">
      <header class="gen-header glass">
        <div class="logo-wrap small">
          <span class="logo-icon">⚡</span>
          <span class="logo-text">Amar<span class="accent">Quiz</span></span>
        </div>
        <div class="header-meta" id="headerMeta"></div>
        <button class="btn-ghost" id="btnChangeKey" title="Change API Key">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 7h3a5 5 0 0 1 5 5 5 5 0 0 1-5 5h-3m-6 0H6a5 5 0 0 1-5-5 5 5 0 0 1 5-5h3"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          Change Key
        </button>
      </header>

      <div class="gen-body">
        <div class="gen-card glass fade-in">
          <h2 class="gen-title">Generate a Quiz</h2>

          <div class="field-group">
            <label class="field-label" for="topicInput">Topic</label>
            <input
              type="text"
              id="topicInput"
              class="field-input large"
              placeholder="e.g. World War II, Python basics, Quantum Physics…"
            />
          </div>

          <div class="options-row">
            <div class="field-group half">
              <label class="field-label" for="numQuestions">Number of Questions</label>
              <select id="numQuestions" class="field-select">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="15">15</option>
                <option value="20">20</option>
              </select>
            </div>
            <div class="field-group half">
              <label class="field-label" for="difficulty">Difficulty</label>
              <select id="difficulty" class="field-select">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
                <option value="mixed">Mixed</option>
              </select>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">Question Type</label>
            <div class="type-pills">
              <button class="type-pill active" data-type="mcq" id="type-mcq">Multiple Choice</button>
              <button class="type-pill" data-type="truefalse" id="type-truefalse">True / False</button>
              <button class="type-pill" data-type="mixed" id="type-mixed">Mixed</button>
            </div>
          </div>

          <button class="btn-primary generate-btn" id="btnGenerate">
            <span id="genBtnText">Generate Quiz</span>
            <svg id="genBtnIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
            <div class="spinner hidden" id="spinner"></div>
          </button>
        </div>

        <!-- ===== QUIZ CONTAINER ===== -->
        <div class="quiz-container hidden" id="quizContainer">
          <div class="quiz-meta glass" id="quizMeta"></div>
          <div id="questionsWrap"></div>
          <div class="quiz-actions">
            <button class="btn-secondary" id="btnSubmitQuiz">Submit Answers</button>
            <button class="btn-ghost" id="btnNewQuiz">New Quiz</button>
          </div>
        </div>

        <!-- ===== RESULTS ===== -->
        <div class="results-container hidden" id="resultsContainer">
          <div class="results-card glass">
            <div class="score-ring-wrap">
              <svg class="score-ring" viewBox="0 0 120 120" width="120" height="120">
                <circle class="ring-bg" cx="60" cy="60" r="50"/>
                <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="50"/>
              </svg>
              <div class="score-text" id="scoreText"></div>
            </div>
            <h3 class="result-title" id="resultTitle"></h3>
            <p class="result-msg" id="resultMsg"></p>
            <div class="result-actions">
              <button class="btn-primary" id="btnRetakeQuiz">Retake Quiz</button>
              <button class="btn-ghost" id="btnNewQuizFromResult">New Topic</button>
            </div>
          </div>
          <div id="reviewWrap" class="review-wrap"></div>
        </div>
      </div>
    </section>

  </div><!-- /app -->

  <script src="app.js"></script>
</body>
</html>
